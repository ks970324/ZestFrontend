<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Zest Game lobby</title>
    <style>
        body {
            font-family: "Press Start 2P", sans-serif;
            background: url("material/gamelobbybackground1.png");
            background-size: cover;

        }
        .header {
            display: flex;
            width: 100%;
        }

        .home-icon img{
            cursor: pointer;
            width:36px;
            margin-left: 5px;
            margin-top: 5px;
        }

        .dropdown {
            position: relative;
            display: inline-block;
            left:92%;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            right: 5%;
            background-color: #ab9377;
            border: black solid 3px;
        }

        .dropdown-profile{
            width: 100%;
            border-bottom: black solid 3px;
            box-sizing: border-box;
            padding: 5px;
        }

        .dropdown-music {
            padding: 5px;
        }


        .dropdown-content img {
            display: block;
            width: 30px;
            height:30px;
            padding: 5px;
            cursor: pointer;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .game-entry {
            display: flex;
        }

        .game-gate img {
            position: absolute;
            bottom: 5%;         /* 貼齊底部 */
            right: 15%;           /* 靠左 */
            width: 40%;      /* 可根據實際調整 */
            z-index: 1;
        }

        .user-character img {
            position: absolute;
            bottom: 5%;         /* 貼齊底部 */
            left: 15%;           /* 靠左 */
            width: 5%;      /* 可根據實際調整 */
        }

        .game-card img {
            position: absolute;
            width: 21%;
            right:25%;
            top:38%;
        }

        .bird {
            position: absolute;
            width: 10%;
            height: 10%;
            background-image: url('material/bird.png');
            background-size: contain;
            background-repeat: no-repeat;
            animation: flyaway 3s ease-in forwards;
            z-index: 2;
        }

        @keyframes flyaway {
            0% {
                left: 5%;
                top: 40%;
                opacity: 1;
            }
            80% {
                left: 60%;
                top: 50%;
                opacity: 1;
            }
            100% {
                left: 60%;
                top: 50%;
                opacity: 0;
            }
        }

        .game-profile {
            display: none;
        }

    </style>
</head>
<body>
<div class="header">
    <div class="home-icon">
        <a href="homepage.html"><img src="material/logo.png" alt="home" class="home-icon"></a>
    </div>
    <div class="dropdown">
        <!-- 主按鈕圖片 -->
        <img src="material/bag.png" alt="主圖片">

        <!-- 下拉圖片選單 -->
        <div class="dropdown-content">
            <div class="dropdown-profile">
                <a href="https://example.com/1">
                    <img src="material/profile.png" alt="profile">
                </a>
            </div>
            <div class="dropdown-music">
                <img src="material/music-on.png" alt="music" onclick="toggleAudio()">
            </div>
        </div>
        <audio id="background-audio" autoplay loop>
            <source src="music/gamelobby.mp3" type="audio/mp3">
            Your browser does not support the audio element.
        </audio>
    </div>
</div>

<div class="bird"></div>
<div class="game-entry">
    <div class="user-character">
        <img src="material/boy_black_darkgreen.png" alt="user-character">
    </div>
    <div class="game-gate">
        <img src="material/gamelobbygate.png" alt="game-entry">
        <div class="game-card">
            <a href="cybershooter.html">
                <img src="material/gamecard.png" alt="game-card">
            </a>
        </div>
    </div>
</div>
<div class="game-profile">
    <div class="profile-content" id="profile-content">
        <div class="profile-text" id="profile-text"></div>
        <span class="closeBtn" id="closeBtn" >&times;</span>
    </div>
</div>


<script>
    // 背景音樂控制
    const audio = document.getElementById('background-audio');
    const control = document.querySelector('.audio-control');

    // 預設音樂播放
    document.addEventListener('DOMContentLoaded', () => {
        audio.play().catch(err => {
            console.log('Autoplay blocked:', err);
        });
    });

    function toggleAudio() {
        if (audio.paused) {
            audio.play();
            control.innerHTML = '<img src="/material/music-on.png" alt="Music On" width="30">';
        } else {
            audio.pause();
            control.innerHTML = '<img src="/material/music-off.png" alt="Music On" width="30">';
        }
    }

</script>

</body>
</html>
