<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zest game lobby</title>
<style>
    .backpack img {
        position: fixed; /* 固定位置 */
        top: 10px;
        right: 20px;
        width: 60px;
        height: 60px;
        z-index: 1000; /* 確保 icon 在最上層 */
    }
    ul{
        list-style-type:none;
        margin:0;
        padding:0;
        overflow:hidden;
        background-color:#333;
    }

    li{
        float:left;
    }

    li a, .dropbtn
    {
        display:inline-block;
        color:white;
        text-align:center;
        padding:14px 16px;
        text-decoration:none;
    }

    li a:hover, .dropdown:hover, .dropbtn
    {
        background-color:#111;
    }

    .dropdown
    {
        display:inline-block;
    }

    .backpack-content
    {
        display:none;
        position:absolute;
        background-color:#f9f9f9;
        min-width:160px;
        box-shadow:0px 8px 16px 0px rgba(0,0,0,0.2);
    }

    .backpack-content a
    {
        color:black;
        padding:12px 16px;
        text-decoration:none;
        display:block;
    }

    .backpack-content a:hover {background-color: #f1f1f1}

    .backpack img:hover .dropdown-content
    {
        display:block;
    }

</style>
</head>
<body>
<div>
    <a href="#" class="backpack">
        <img src="/material/backpack.png">
    </a>
    <div class="backpack-content">
        <a href="#">链接 1</a>
        <a href="#">链接 2</a>
        <a href="#">链接 3</a>
    </div>
</div>
<ul>
    <li><a class="active" href="#home">主页</a></li>
    <li><a href="#news">新闻</a></li>
    <div class="dropdown">
        <a href="#" class="dropbtn">下拉菜单</a>
        <div class="dropdown-content">
            <a href="#">链接 1</a>
            <a href="#">链接 2</a>
            <a href="#">链接 3</a>
        </div>
    </div>
</ul>

<h3>导航栏上的下拉菜单</h3>
<p>鼠标移动到 "下拉菜单" 链接先显示下拉菜单。</p>

</body>
</html>
